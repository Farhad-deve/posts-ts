<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>lesson-ts</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

  <!-- CSS -->
  <link rel="stylesheet" href="/src/style.css">

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
    integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
    crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>

<body class="bg-[#2b2b2b] px-[clamp(1rem,7vw,10rem)] py-[clamp(1.5rem,3vw,3rem)]">

  <div id="app">
    <header class="flex items-center justify-between border-1 border-[#ffffff5d] p-[1rem] rounded-[8px]">
      <h1 class="text-[#fff] font-[600] text-[clamp(1.3rem,1.7vw,2rem)]">Posts</h1>

      <nav>
        <form>
          <button id="addNewPost" type="button"
            class="text-[#fff] bg-[#ff4800] font-[600] px-[1.2rem] py-[0.5rem] cursor-pointer text-[clamp(1rem,1.2vw,1.3rem)] rounded-[5px] hover:bg-[#ee3800f8]">Add
            New</button>
        </form>
      </nav>
    </header>

    <main class="
      grid grid-cols-1 py-[1.5rem] gap-[1rem]
      sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-3 xl:grid-cols-4
      " id="cards-container">



    </main>
  </div>

  <!-- Loading -->
  <div hidden id="loading-container" class="bg-[#55f]/[0.5] border-1 border-[#55f] text-center py-[5rem] rounded-[12px] flex items-center justify-center">
    <h2 class="text-[#fff]">Loading...</h2>
  </div>

  <!-- ========== Modals ========== -->

  <!-- Add New Modal -->
  <div id="modalWrapper" hidden class="fixed inset-0 flex justify-center items-center z-[100] bg-[#000]/[0.4] backdrop-blur-[10px]">
    <div id="modal" class="bg-[#353535] rounded-[12px] w-[90%] max-w-[600px] border-1 border-[#fff3]">

      <!-- Modal header -->
      <div class="flex items-center justify-between p-[1rem] border-b-1 border-b-[#ffffff1f] overflow-hidden rounded-tl-[12px] rounded-tr-[12px]">
        <h2 id="modal-title" class="text-[#fff] font-[600] text-[clamp(1.3rem,1.3vw,1.7rem)]">New Post</h2>
        <button type="button" id="modal-close-btn" class="cursor-pointer text-[#fff] hover:text-[#ff5724]">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>

      <form id="newPostForm" class="px-[1rem] py-[1rem] flex flex-col gap-[1rem]">
        <!-- Title -->
        <div class="flex flex-col gap-[0.5rem]">
          <label for="TitleInput" class="text-[#fff] font-[600]">Title</label>
          <input type="text" name="title" id="TitleInput" placeholder="Post title"
            class="bg-[#00000040] border-1 border-[#a5a5a581] rounded-[6px] px-[0.8rem] py-[0.5rem] text-[#fff] focus:border-[#ff5724] w-full"
            required>
        </div>

        <!-- Description -->
        <div class="flex flex-col gap-[0.5rem]">
          <label for="descriptionTextarea" class="text-[#fff] font-[600] flex items-center justify-between">
            Description
            <span class="text-[#c4c4c4] text-[clamp(0.7rem,0.8vw,0.9rem)]">
              <span id="descriptionCounter">0</span>/2000
            </span>
          </label>
          <textarea name="description" id="descriptionTextarea" placeholder="Post description" rows="5"
            class="bg-[#00000040] border-1 border-[#a5a5a581] rounded-[6px] px-[0.8rem] py-[0.5rem] text-[#fff] focus:border-[#ff5724] w-full resize-none"
            required></textarea>
        </div>

        <!-- Image Upload -->
        <div class="flex flex-col gap-[0.5rem]">
          <label for="imageInput" class="text-[#fff] font-[600] flex items-center justify-between">
            Image
            <span id="upload-img-hint" class="text-[#c4c4c4] text-[clamp(0.7rem,0.8vw,0.9rem)]">(required)</span>
          </label>
          <input type="file" name="image" id="imageInput" accept="image/*"
            class="text-[#fff] p-[0.5rem] bg-[#0000] rounded-[4px] border-1 border-[#a5a5a581] text-[clamp(0.8rem,0.9vw,1rem)]
              file:border-1 file:border-[#a5a5a581] file:cursor-pointer file:rounded-[4px] file:py-[0.2rem] file:px-[0.6rem] file:mr-[0.5rem]">

          <!-- Preview Image -->
          <div id="preview-img-container" hidden>
            <img id="preview-img" src="" alt="Preview image"
              class="object-cover border-1 border-[#ffffff26] rounded-[6px] w-full max-h-[200px]">
          </div>
        </div>

        <!-- Error message -->
        <p id="error-message" class="text-[#ffa0a0] bg-[#ff252526] border-1 border-[#ff252566] rounded-[6px] px-[0.7rem] py-[0.5rem] text-[0.9rem]" hidden></p>

        <!-- Action buttons -->
        <div class="flex flex-col gap-[0.5rem] md:flex-row-reverse">
          <button type="submit" id="save-btn" class="text-[#fff] bg-[#ff4800] border-1 border-[#ff5724] rounded-[5px] cursor-pointer px-[1rem] py-[0.5rem] font-[600] text-[1rem] hover:bg-[#ee3800f8] disabled:cursor-not-allowed disabled:opacity-50">Save</button>
          <button type="button" id="cancel-btn" class="text-[#fff] bg-[#0000] border-1 border-[#a5a5a581] rounded-[5px] cursor-pointer px-[1rem] py-[0.5rem] font-[600] text-[1rem] hover:bg-[#a5a5a526]">Cancel</button>
        </div>

      </form>

    </div>
  </div>

  <!-- Confirm Modal -->
  <div id="confirmModalWrapper" hidden class="fixed inset-0 flex justify-center items-center z-[100] bg-[#000]/[0.4] backdrop-blur-[10px]">
    <div id="confirmModal" class="bg-[#353535] rounded-[12px] w-[90%] max-w-[500px] border-1 border-[#fff3]">

      <!-- Modal header -->
      <div class="flex items-center justify-between p-[1rem] border-b-1 border-b-[#ffffff1f] overflow-hidden rounded-tl-[12px] rounded-tr-[12px]">
        <h2 class="text-[#fff] font-[600] text-[clamp(1.3rem,1.3vw,1.7rem)]">Confirm</h2>
        <button type="button" id="modal-close-btn" class="cursor-pointer text-[#fff] hover:text-[#ff5724]">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>

      <!-- Modal body -->
      <div class="p-[1rem]">
        <p class="text-[#fff]">Are you sure you want to delete this post? This action cannot be undone.</p>
      </div>

      <!-- Modal footer -->
      <div class="flex flex-col gap-[0.5rem] md:flex-row-reverse p-[1rem]">
        <button type="button" id="delete-btn" class="text-[#fff] bg-[#ff4800] border-1 border-[#ff5724] rounded-[5px] cursor-pointer px-[1rem] py-[0.5rem] font-[600] text-[1rem] hover:bg-[#ee3800f8] disabled:cursor-not-allowed disabled:opacity-50">Delete</button>
        <button type="button" id="cancel-btn" class="text-[#fff] bg-[#0000] border-1 border-[#a5a5a581] rounded-[5px] cursor-pointer px-[1rem] py-[0.5rem] font-[600] text-[1rem] hover:bg-[#a5a5a526]">Cancel</button>
      </div>
    </div>
  </div>


  <script type="module" src="/src/main.ts"></script>
</body>

</html>
